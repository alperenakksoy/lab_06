version: "3.9"

networks:
  telemetry-net:
    driver: bridge

services:

 # 1. REST / HTTP 1.1
  http1:
    build:
      context: .
      dockerfile: Dockerfile.http1
    container_name: telemetry-http1
    ports:
      - "8001:8001"
    networks:
      - telemetry-net
    healthcheck:
      test: ["CMD", "python", "-c",
         "import urllib.request; urllib.request.urlopen('http://localhost:8001/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  # 2. gRPC
  grpc:
    build:
      context: .
      dockerfile: Dockerfile.grpc
    container_name: telemetry-grpc
    ports:
      - "50051:50051"
    networks:
      - telemetry-net
    healthcheck:
      test: ["CMD", "python", "-c",
             "import grpc; ch = grpc.insecure_channel('localhost:50051'); grpc.channel_ready_future(ch).result(timeout=5)"]
      interval: 10s
      timeout: 8s
      retries: 5
      start_period: 8s
    restart: unless-stopped

  # 3. WebSocket
  websocket:
    build:
      context: .
      dockerfile: Dockerfile.websocket
    container_name: telemetry-websocket
    ports:
      - "8003:8003"
      - "8080:8080"
    networks:
      - telemetry-net
    healthcheck:
      test: [ "CMD", "python", "-c",
              "import urllib.request; urllib.request.urlopen('http://localhost:8080/health', timeout=3)" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  # 4. MQTT Broker (Mosquitto)
  mqtt-broker:
    build:
      context: .
      dockerfile: Dockerfile.mqtt
    container_name: telemetry-mqtt-broker
    ports:
      - "1883:1883"
      - "9001:9001"
    networks:
      - telemetry-net
    healthcheck:
      test: ["CMD", "mosquitto_sub", "-t", "$$SYS/#", "-C", "1", "-i", "healthcheck", "-W", "3"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  # MQTT Service — QoS 0
  mqtt-service-qos0:
    build:
      context: .
      dockerfile: Dockerfile.mqtt-service
    container_name: telemetry-mqtt-service-qos0
    environment:
      - MQTT_BROKER_HOST=mqtt-broker
      - MQTT_BROKER_PORT=1883
      - MQTT_SERVICE_QOS=0
    networks:
      - telemetry-net
    depends_on:
      mqtt-broker:
        condition: service_healthy
    restart: unless-stopped

  # MQTT Service — QoS 1
  mqtt-service-qos1:
    build:
      context: .
      dockerfile: Dockerfile.mqtt-service
    container_name: telemetry-mqtt-service-qos1
    environment:
      - MQTT_BROKER_HOST=mqtt-broker
      - MQTT_BROKER_PORT=1883
      - MQTT_SERVICE_QOS=1
    networks:
      - telemetry-net
    depends_on:
      mqtt-broker:
        condition: service_healthy
    restart: unless-stopped

  # MQTT Service — QoS 2
  mqtt-service-qos2:
    build:
      context: .
      dockerfile: Dockerfile.mqtt-service
    container_name: telemetry-mqtt-service-qos2
    environment:
      - MQTT_BROKER_HOST=mqtt-broker
      - MQTT_BROKER_PORT=1883
      - MQTT_SERVICE_QOS=2
    networks:
      - telemetry-net
    depends_on:
      mqtt-broker:
        condition: service_healthy
    restart: unless-stopped

  toxiproxy:
      image: ghcr.io/shopify/toxiproxy:2.9.0
      container_name: telemetry-toxiproxy
      ports:
        - "8474:8474"
        - "18001:18001"
        - "55051:55051"
        - "18003:18003"
        - "11883:11883"
      networks:
        - telemetry-net
      restart: unless-stopped